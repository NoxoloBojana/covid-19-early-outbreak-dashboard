
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COVID-19 Early Outbreak Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>COVID-19 Early Outbreak Dashboard</h1>
    <p>Understanding the early spread of COVID-19 across countries.</p>

    <!-- Country Selector -->
    <div class="country-selector">
        <label for="country-select">Select a country:</label>

        <select id="country-select">
            <option value="China">China</option>
            <option value="Italy">Italy</option>
            <option value="South Korea">South Korea</option>
            <option value="United States">United States</option>
            <option value="South Africa" selected>South Africa</option>
        </select>
    </div>

    <!-- COVID-19 Metric Cards -->
    <div class="dashboard">

        <div class="metric-card">
            <h2>Confirmed Cases</h2>
            <p id="confirmed-cases">0</p>
        </div>

        <div class="metric-card">
            <h2>Deaths</h2>
            <p id="deaths">0</p>
        </div>

        <div class="metric-card">
            <h2>Recoveries</h2>
            <p id="recoveries">0</p>
        </div>

        <div class="metric-card">
            <h2>Active Cases</h2>
            <p id="active-cases">0</p>
        </div>

    </div>

    <!-- COVID-19 Line Chart -->
    <div class="chart-container">
        <h2>COVID-19 Cases Over Time</h2>
        <canvas id="covidLineChart"></canvas>
    </div>

    <!-- COVID-19 Bar Chart -->
    <div class="chart-container">
        <h2>Increase in Confirmed Cases Between Recorded Dates</h2>
        <canvas id="covidBarChart"></canvas>
    </div>

    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Our JavaScript File -->
    <script src="js/script.js"></script>

</body>
</html>
