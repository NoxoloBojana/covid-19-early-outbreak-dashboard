
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COVID-19 Early Outbreak Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>COVID-19 Early Outbreak Dashboard</h1>

    <p>Understanding the early spread of COVID-19 across countries.</p>

    <div class="dashboard">

        <!-- Confirmed Cases Card -->
        <div class="metric-card">
            <h2>Confirmed Cases</h2>
            <p id="confirmed-cases">0</p>
        </div>

        <!-- Deaths Card -->
        <div class="metric-card">
            <h2>Deaths</h2>
            <p id="deaths">0</p>
        </div>

        <!-- Recoveries Card -->
        <div class="metric-card">
            <h2>Recoveries</h2>
            <p id="recoveries">0</p>
        </div>

        <!-- Active Cases Card -->
        <div class="metric-card">
            <h2>Active Cases</h2>
            <p id="active-cases">0</p>
        </div>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
